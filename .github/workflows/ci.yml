name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify-site:
    name: Verify site (JS/HTML syntax, local asset links)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node .github/scripts/verify-site.mjs
