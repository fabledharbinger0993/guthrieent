<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Admin Dashboard — Guthrie Submissions</title>
<style>
  :root{
    --bg:#f5f7fb; --card:#fff; --text:#0f1722; --muted:#6b7280;
    --accent:#0b84ff; --accent-2:#0a66d3; --danger:#ef4444;
    --radius:12px; --border:#e6e9ef;
    --font:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--font);background:var(--bg);color:var(--text);padding:24px}
  .wrap{max-width:1100px;margin:0 auto}
  .header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:24px}
  h1{font-size:24px;margin:0}
  .muted{color:var(--muted);font-size:14px}

  /* Login gate */
  .gate{max-width:400px;margin:80px auto;background:var(--card);padding:32px;border-radius:var(--radius);box-shadow:0 4px 24px rgba(2,6,23,.08)}
  .gate h2{margin:0 0 8px}
  .gate input{width:100%;padding:12px;border:1px solid var(--border);border-radius:8px;font-size:14px;margin-top:12px}
  .gate button{width:100%;padding:12px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-weight:600;cursor:pointer;margin-top:16px}
  .gate .err{color:var(--danger);font-size:13px;margin-top:8px;display:none}

  /* Stats */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;margin-bottom:24px}
  .stat{background:var(--card);padding:20px;border-radius:var(--radius);box-shadow:0 2px 8px rgba(2,6,23,.04)}
  .stat .label{font-size:13px;color:var(--muted);font-weight:600}
  .stat .value{font-size:32px;font-weight:700;margin-top:4px}

  /* Table */
  .table-card{background:var(--card);border-radius:var(--radius);overflow:hidden;box-shadow:0 2px 8px rgba(2,6,23,.04)}
  table{width:100%;border-collapse:collapse}
  th{text-align:left;padding:14px 16px;background:#f8fafc;font-size:13px;color:var(--muted);font-weight:600;border-bottom:1px solid var(--border)}
  td{padding:14px 16px;border-bottom:1px solid var(--border);font-size:14px;vertical-align:top}
  tr:last-child td{border-bottom:none}
  tr:hover{background:#f8fafc}
  .email{color:var(--accent-2);text-decoration:none}
  .email:hover{text-decoration:underline}
  .opt-list{margin:0;padding-left:18px;font-size:13px;color:var(--muted)}
  .date{font-size:12px;color:var(--muted);white-space:nowrap}
  .del{background:transparent;border:none;color:var(--danger);cursor:pointer;font-size:13px;padding:4px 8px;border-radius:6px}
  .del:hover{background:#fef2f2}
  .empty{text-align:center;padding:48px;color:var(--muted)}

  /* Pagination */
  .pager{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:20px}
  .pager button{padding:8px 14px;border:1px solid var(--border);background:#fff;border-radius:8px;cursor:pointer;font-size:14px}
  .pager button:disabled{opacity:.4;cursor:not-allowed}
  .pager button.active{background:var(--accent);color:#fff;border-color:var(--accent)}

  .actions-top{display:flex;gap:8px;align-items:center}
  .btn-sm{padding:8px 14px;border-radius:8px;border:1px solid var(--border);background:#fff;cursor:pointer;font-size:14px;font-weight:600}
  .btn-sm.danger{color:var(--danger);border-color:#fecaca}

  .toast{position:fixed;bottom:24px;right:24px;background:#065f46;color:#fff;padding:12px 18px;border-radius:8px;font-weight:600;opacity:0;transform:translateY(10px);transition:all .2s}
  .toast.show{opacity:1;transform:none}

  @media(max-width:700px){
    table{font-size:13px}
    th:nth-child(4),td:nth-child(4){display:none}
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- LOGIN GATE -->
  <div class="gate" id="gate">
    <h2>Admin Access</h2>
    <p class="muted">Enter your dashboard key to view submissions.</p>
    <input type="password" id="keyInput" placeholder="Dashboard key" autocomplete="current-password" />
    <button id="loginBtn">Unlock Dashboard</button>
    <div class="err" id="loginErr">Invalid key. Please try again.</div>
  </div>

  <!-- DASHBOARD (hidden until authed) -->
  <div id="dashboard" style="display:none">
    <div class="header">
      <div>
        <h1>Submissions</h1>
        <div class="muted" id="lastUpdated"></div>
      </div>
      <div class="actions-top">
        <button class="btn-sm" id="refreshBtn">↻ Refresh</button>
        <button class="btn-sm danger" id="logoutBtn">Log out</button>
      </div>
    </div>

    <div class="stats" id="stats"></div>

    <div class="table-card">
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Purpose</th>
            <th>Options</th>
            <th>Submitted</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>

    <div class="pager" id="pager"></div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
const API = '/api/submissions';
let dashboardKey = sessionStorage.getItem('dashboardKey') || '';
let currentPage = 1;
let totalPages = 1;

// --- Auth ---
document.getElementById('loginBtn').addEventListener('click', login);
document.getElementById('keyInput').addEventListener('keydown', e => { if(e.key==='Enter') login(); });
document.getElementById('logoutBtn').addEventListener('click', logout);
document.getElementById('refreshBtn').addEventListener('click', () => loadSubmissions(currentPage));

async function login(){
  const key = document.getElementById('keyInput').value.trim();
  if(!key) return;
  dashboardKey = key;
  const ok = await loadSubmissions(1);
  if(ok){
    sessionStorage.setItem('dashboardKey', key);
    document.getElementById('gate').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
  } else {
    document.getElementById('loginErr').style.display = 'block';
    dashboardKey = '';
  }
}

function logout(){
  sessionStorage.removeItem('dashboardKey');
  dashboardKey = '';
  location.reload();
}

// --- Load submissions ---
async function loadSubmissions(page=1){
  currentPage = page;
  try {
    const res = await fetch(`${API}?page=${page}&per_page=25`, {
      headers: { 'X-Dashboard-Key': dashboardKey }
    });
    if(res.status === 401){ return false; }
    if(!res.ok) throw new Error('Fetch failed');
    const data = await res.json();

    renderStats(data.pagination.total);
    renderTable(data.submissions);
    renderPager(data.pagination);
    document.getElementById('lastUpdated').textContent = 'Updated ' + new Date().toLocaleString();
    return true;
  } catch(err){
    console.error(err);
    showToast('Failed to load submissions', true);
    return false;
  }
}

function renderStats(total){
  const el = document.getElementById('stats');
  el.innerHTML = `
    <div class="stat"><div class="label">Total Submissions</div><div class="value">${total}</div></div>
    <div class="stat"><div class="label">Current Page</div><div class="value">${currentPage}</div></div>
  `;
}

function renderTable(rows){
  const body = document.getElementById('tableBody');
  if(!rows || rows.length === 0){
    body.innerHTML = `<tr><td colspan="6" class="empty">No submissions yet. Once people fill out the form, they'll appear here.</td></tr>`;
    return;
  }
  body.innerHTML = rows.map(r => `
    <tr>
      <td><strong>${esc(r.name)}</strong></td>
      <td><a class="email" href="mailto:${esc(r.email)}">${esc(r.email)}</a></td>
      <td>${esc(r.purpose || '—')}</td>
      <td>${formatOptions(r.options)}</td>
      <td class="date">${formatDate(r.created_at)}</td>
      <td><button class="del" data-id="${r.id}">Delete</button></td>
    </tr>
  `).join('');

  body.querySelectorAll('.del').forEach(btn => {
    btn.addEventListener('click', () => deleteSubmission(btn.dataset.id));
  });
}

function renderPager(p){
  totalPages = p.total_pages;
  const el = document.getElementById('pager');
  if(p.total_pages <= 1){ el.innerHTML = ''; return; }

  let html = '';
  html += `<button ${p.page===1?'disabled':''} onclick="loadSubmissions(${p.page-1})">← Prev</button>`;
  for(let i=1; i<=p.total_pages; i++){
    html += `<button class="${i===p.page?'active':''}" onclick="loadSubmissions(${i})">${i}</button>`;
  }
  html += `<button ${p.page===p.total_pages?'disabled':''} onclick="loadSubmissions(${p.page+1})">Next →</button>`;
  el.innerHTML = html;
}

async function deleteSubmission(id){
  if(!confirm('Delete this submission? This cannot be undone.')) return;
  try {
    const res = await fetch(API, {
      method: 'DELETE',
      headers: { 'X-Dashboard-Key': dashboardKey, 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: parseInt(id) })
    });
    if(!res.ok) throw new Error();
    showToast('Submission deleted');
    loadSubmissions(currentPage);
  } catch {
    showToast('Delete failed', true);
  }
}

// --- Helpers ---
function esc(str){
  const d = document.createElement('div');
  d.textContent = str ?? '';
  return d.innerHTML;
}
function formatDate(iso){
  if(!iso) return '—';
  const d = new Date(iso + 'Z');
  return d.toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' }) +
    '<br>' + d.toLocaleTimeString('en-US', { hour:'numeric', minute:'2-digit' });
}
function formatOptions(opts){
  if(!opts) return '—';
  if(Array.isArray(opts)) return `<ul class="opt-list">${opts.map(o=>`<li>${esc(o)}</li>`).join('')}</ul>`;
  return esc(String(opts));
}
function showToast(msg, isError=false){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background = isError ? '#991b1b' : '#065f46';
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

// --- Auto-login if key in session ---
if(dashboardKey){ login(); }
</script>
</body>
</html>
