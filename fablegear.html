    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #07060b;
            --panel: rgba(19, 14, 28, 0.86);
            --line: rgba(255, 255, 255, 0.09);
            --magenta: #ff3d9e;
            --violet: #8d5cf6;
            --cyan: #3ddbff;
            --ink: #f4eff9;
            --ink-dim: #ab9dc5;
        }

        * { box-sizing: border-box; }

        body {
            background-color: var(--bg);
            color: var(--ink-dim);
            font-family: 'IBM Plex Sans', sans-serif;
            margin: 0;
            line-height: 1.65;
            position: relative;
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url('Spectre.png');
            background-size: 680px;
            background-position: center 60px;
            background-repeat: no-repeat;
            opacity: 0.14;
            pointer-events: none;
            z-index: 0;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: repeating-linear-gradient(
                0deg,
                rgba(255,255,255,0.012) 0px,
                rgba(255,255,255,0.012) 1px,
                transparent 1px,
                transparent 3px
            );
            pointer-events: none;
            z-index: 0;
        }

        /* ── Splash gate ─────────────────────────────────────────────── */
        #splash {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 1;
            transition: opacity 0.6s ease;
        }
        #splash.done { opacity: 0; pointer-events: none; }
        #splash video { width: 100%; height: 100%; object-fit: contain; }
        #splash-skip {
            position: absolute;
            bottom: 28px;
            right: 28px;
            background: rgba(0,0,0,0.45);
            border: 1px solid rgba(255,255,255,0.28);
            color: #fff;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 12px;
            letter-spacing: 1.5px;
            padding: 9px 18px;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
        }
        #splash-skip:hover { border-color: var(--magenta); color: var(--magenta); }
        body.splash-open { overflow: hidden; }
        @media (prefers-reduced-motion: reduce) { #splash { display: none; } }

        .wrap { max-width: 880px; margin: 0 auto; padding: 0 24px; }
        header, main, footer { position: relative; z-index: 1; }

        a { color: var(--cyan); }
        :focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }

        .back-nav { position: fixed; top: 14px; left: 20px; z-index: 90; }
        .return-btn { display: block; width: clamp(80px, 9vw, 130px); transition: transform 0.10s ease, filter 0.10s ease; }
        .return-btn img { display: block; width: 100%; height: auto; }
        .return-btn:hover { filter: brightness(1.2) drop-shadow(0 0 10px rgba(255,61,158,0.5)); transform: scale(1.05); }
        .return-btn:active { transform: scale(0.93); }

        header { padding: 36px 0 8px; text-align: center; }
        .brand {
            font-family: 'Chakra Petch', sans-serif;
            color: var(--ink);
            font-size: 32px;
            font-weight: 700;
            text-decoration: none;
            letter-spacing: 2px;
            transition: color 0.2s ease;
        }
        .brand:hover { color: var(--magenta); }
        .kicker {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            letter-spacing: 2.5px;
            color: var(--ink-dim);
            margin-top: 10px;
            text-transform: uppercase;
        }
        /* Hide the original long panels so the page stays short */
        .survey-removed { display: none !important; }

        /* Floats with the mascot rather than sitting inline at the very top of
           <body>, where it rendered as an unstyled button above the header. */
        /* ── "Click here" sign ────────────────────────────────────────────
           A hovering neon sign above Spectre with an arrow pointing down at
           him, rather than a standalone button off on its own — the point is
           to say *he* is the thing you interact with.

           The plate hugs the right edge and the arrow is nudged inward to sit
           over his centre (--arrow-nudge), instead of centring the whole sign
           on him. Centring would push a ~190px plate off the right of the
           viewport once 2vw gets small, which is a real case on a ~1000px
           window, not just on phones. */
        .start-survey {
          position: fixed;
          bottom: calc(12vh + 154px);   /* mascot is 140px and square */
          right: 2vw;
          --arrow-nudge: 59px;          /* arrow centre → mascot centre */
          z-index: 12001;
          display: flex;
          flex-direction: column;
          align-items: flex-end;
          gap: 2px;
          background: none;
          border: none;
          padding: 0;
          cursor: pointer;
          animation: sign-bob 3.4s ease-in-out infinite;
          transition: opacity 0.25s ease;
        }
        .sign-plate {
          background: rgba(19,14,28,0.94);
          border: 1px solid var(--magenta);
          border-radius: 8px;
          padding: 9px 15px;
          font-family: 'Chakra Petch', sans-serif;
          font-weight: 700;
          font-size: 12.5px;
          letter-spacing: 0.6px;
          color: var(--ink);
          white-space: nowrap;
          text-shadow: 0 0 9px rgba(255,61,158,0.75);
          box-shadow:
            0 0 14px rgba(255,61,158,0.45),
            inset 0 0 14px rgba(255,61,158,0.12);
          transition: box-shadow 0.2s ease, border-color 0.2s ease;
        }
        .sign-arrow {
          margin-right: var(--arrow-nudge);
          color: var(--cyan);
          fill: none;
          stroke: currentColor;
          stroke-width: 3;
          stroke-linecap: round;
          stroke-linejoin: round;
          filter: drop-shadow(0 0 5px var(--cyan)) drop-shadow(0 0 13px rgba(61,219,255,0.5));
        }
        /* Settle once you're going for it — a target that never stops moving
           is needlessly fiddly to hit, and worse with a tremor or a trackpad. */
        .start-survey:hover,
        .start-survey:focus-visible { animation-play-state: paused; }
        .start-survey:hover .sign-plate {
          border-color: var(--cyan);
          box-shadow:
            0 0 22px rgba(255,61,158,0.6),
            inset 0 0 16px rgba(61,219,255,0.16);
        }
        @keyframes sign-bob {
          0%, 100% { transform: translateY(0); }
          50%      { transform: translateY(-7px); }
        }
        /* Once the bubble is open the button is redundant and, on a phone,
           sits on top of the sheet — so it gets out of the way. */
        body:has(#mascot.open) .start-survey { opacity: 0; pointer-events: none; }

        /* ── Mascot + bubble ──────────────────────────────────────────────
           Two layouts on purpose. Desktop: the bubble hangs above-left of
           Spectre, anchored to his box, with a tail pointing at him. Phone:
           that anchoring cannot fit — a 360px bubble hung off a mascot pinned
           to the right edge lands mostly off-screen — so below 640px it
           becomes a viewport-width bottom sheet and the tail is dropped,
           since it would no longer be pointing at anything. */
        #mascot {
          position: fixed;
          bottom: 12vh;
          right: 2vw;
          width: 140px;
          z-index: 12000;
          cursor: pointer;
          user-select: none;
          transition: transform 220ms ease;
        }
        #mascot img { width: 100%; height: auto; display: block; pointer-events: none; }

        .mascot-bubble {
          position: absolute;
          bottom: calc(100% + 18px);
          right: 0;
          width: 360px;
          max-width: calc(100vw - 2vw - 24px);
          background: rgba(19,14,28,0.97);
          border: 1px solid var(--line);
          color: var(--ink);
          border-radius: 12px;
          box-shadow: 0 18px 44px rgba(0,0,0,0.55);
          backdrop-filter: blur(10px);
          padding: 18px;
          display: none;
          font-family: 'IBM Plex Sans', sans-serif;
          font-size: 14px;
          text-align: left;
        }
        .mascot.open .mascot-bubble { display: block; }
        /* Tail: same fill + only the two outward edges bordered, so it reads
           as part of the panel rather than a diamond sitting on top of it. */
        .mascot-bubble::after {
          content: "";
          position: absolute;
          right: 38px;
          bottom: -7px;
          width: 12px;
          height: 12px;
          background: rgba(19,14,28,0.97);
          border-right: 1px solid var(--line);
          border-bottom: 1px solid var(--line);
          transform: rotate(45deg);
        }
        .mascot-bubble-text {
          font-family: 'Chakra Petch', sans-serif;
          font-weight: 700;
          font-size: 1.02rem;
          line-height: 1.3;
          color: var(--ink);
          margin-bottom: 14px;
        }
        .mascot-bubble-content {
          max-height: 44vh;
          overflow-y: auto;
          overscroll-behavior: contain;
          -webkit-overflow-scrolling: touch;
        }

        /* Controls */
        .mascot-controls {
          display: flex;
          gap: 8px;
          align-items: center;
          flex-wrap: wrap;
          margin-top: 16px;
          padding-top: 14px;
          border-top: 1px solid var(--line);
        }
        .mascot-btn {
          background: transparent;
          color: var(--ink-dim);
          border: 1px solid var(--line);
          padding: 8px 13px;
          border-radius: 6px;
          cursor: pointer;
          font-family: 'Chakra Petch', sans-serif;
          font-weight: 700;
          font-size: 12px;
          letter-spacing: 0.4px;
          transition: border-color 0.15s ease, color 0.15s ease;
        }
        .mascot-btn:hover { border-color: var(--cyan); color: var(--ink); }
        /* Next is the one forward action, so it carries the page's primary
           gradient; everything else stays a quiet outline. */
        #mascot-next {
          background: linear-gradient(135deg, var(--magenta), var(--violet));
          color: #0a0710;
          border-color: transparent;
        }
        #mascot-next:hover { color: #0a0710; box-shadow: 0 0 18px rgba(255,61,158,0.4); }
        #mascot-cancel:hover { border-color: var(--magenta); color: var(--ink); }
        .mascot-send {
          font-family: 'IBM Plex Mono', monospace;
          font-size: 10px;
          letter-spacing: 0.6px;
          text-transform: uppercase;
          color: var(--ink-dim);
          display: flex;
          align-items: center;
          gap: 6px;
          margin-left: auto;
          white-space: nowrap;
          cursor: pointer;
        }
        .mascot-send input { accent-color: var(--magenta); width: 14px; height: 14px; }

        /* Compact forms inside the bubble */
        .mascot-bubble-content .group-title {
          font-family: 'IBM Plex Mono', monospace;
          font-size: 10px;
          font-weight: 600;
          letter-spacing: 1.6px;
          text-transform: uppercase;
          color: var(--cyan);
          margin: 16px 0 8px;
        }
        .mascot-bubble-content > *:first-child { margin-top: 0; }
        .mascot-bubble-content .compact-grid {
          display: flex;
          flex-direction: column;
          gap: 6px;
          margin-bottom: 12px;
        }
        .mascot-bubble-content .compact-grid > label {
          display: flex;
          align-items: center;
          gap: 9px;
          padding: 9px 11px;
          border: 1px solid var(--line);
          border-radius: 6px;
          background: rgba(255,255,255,0.025);
          color: var(--ink-dim);
          font-size: 0.88rem;
          line-height: 1.35;
          cursor: pointer;
          transition: border-color 0.15s ease, color 0.15s ease;
        }
        .mascot-bubble-content .compact-grid > label:hover { border-color: var(--violet); color: var(--ink); }
        .mascot-bubble-content input[type="checkbox"],
        .mascot-bubble-content input[type="radio"] {
          accent-color: var(--magenta);
          width: 15px;
          height: 15px;
          flex-shrink: 0;
          margin: 0;
        }
        .mascot-bubble-content .likert-compact { margin-bottom: 15px; }
        .mascot-bubble-content .likert-compact > label {
          display: block;
          font-size: 0.85rem;
          line-height: 1.4;
          color: var(--ink-dim);
          margin-bottom: 8px;
        }
        /* The 1–5 row is built with inline styles in JS, so this styles the
           option labels inside it rather than the flex container itself. */
        .mascot-bubble-content .likert-compact > div > label {
          display: inline-flex;
          align-items: center;
          gap: 5px;
          padding: 6px 10px;
          border: 1px solid var(--line);
          border-radius: 5px;
          color: var(--ink-dim);
          cursor: pointer;
          transition: border-color 0.15s ease, color 0.15s ease;
        }
        .mascot-bubble-content .likert-compact > div > label:hover { border-color: var(--cyan); color: var(--ink); }
        .mascot-bubble-content textarea,
        .mascot-bubble-content input[type="text"],
        .mascot-bubble-content input[type="email"] {
          width: 100%;
          min-height: 74px;
          background: rgba(7,6,11,0.6);
          border: 1px solid var(--line);
          border-radius: 6px;
          color: var(--ink);
          font-family: 'IBM Plex Sans', sans-serif;
          font-size: 0.9rem;
          padding: 10px 12px;
          resize: vertical;
          margin-bottom: 12px;
        }
        .mascot-bubble-content input[type="text"],
        .mascot-bubble-content input[type="email"] { min-height: 0; }
        .mascot-bubble-content textarea:focus,
        .mascot-bubble-content input:focus { border-color: var(--cyan); outline: none; }

        /* Idle meander */
        @keyframes meander { 0%{transform:translateY(0) rotate(0);}25%{transform:translateY(-6px) rotate(-2deg);}50%{transform:translateY(0);}75%{transform:translateY(-4px) rotate(1deg);}100%{transfor[...]
        .mascot.idle { animation: meander 6s ease-in-out infinite; }
        .mascot.open.idle { animation: none; }

        /* .mascot-narrated quieting (non-destructive) */
        .mascot-narrated .likert-text, .mascot-narrated .field-label, .mascot-narrated legend, .mascot-narrated p, .mascot-narrated .qblock-title, .mascot-narrated .step-label {
          font-size: 11.5px !important; opacity: 0.55; transition: font-size .18s, opacity .18s;
        }
        .mascot-narrated input, .mascot-narrated textarea, .mascot-narrated .likert-options, .mascot-narrated .check-grid { opacity: 1; }

        /* Small hint pulse */
        .mascot.hint { box-shadow: 0 0 0 6px rgba(255,160,0,0.12); transform:scale(1.02); transition: box-shadow .28s, transform .28s; }
       
        .hero {
            text-align: center;
            padding: 110px 0 90px;
            background:
                radial-gradient(circle at 50% 28%, rgba(141, 92, 246, 0.16) 0%, rgba(7,6,11,0) 55%),
                radial-gradient(circle at 50% 28%, rgba(61, 219, 255, 0.07) 0%, rgba(7,6,11,0) 62%);
        }

        h1 {
            font-family: 'Chakra Petch', sans-serif;
            color: var(--ink);
            font-size: clamp(32px, 6vw, 52px);
            margin-bottom: 22px;
            line-height: 1.18;
        }

        .lede { font-size: 1.1rem; max-width: 640px; margin: 0 auto; }
        .cta-wrap { margin-top: 30px; }
        .cta-btn {
            display: inline-block;
            background: linear-gradient(135deg, var(--magenta), var(--violet));
            color: #0a0710;
            padding: 13px 32px;
            border-radius: 6px;
            font-family: 'Chakra Petch', sans-serif;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-decoration: none;
            border: none;
            cursor: pointer;
            font-size: 15px;
            transition: box-shadow 0.25s ease, transform 0.25s ease;
        }
        .cta-btn:hover { box-shadow: 0 0 30px rgba(255,61,158,0.45); transform: translateY(-1px); }
        .cta-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
        .cta-note {
            display: block;
            margin-top: 16px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 12px;
            color: var(--ink-dim);
            letter-spacing: 0.5px;
        }
        .cta-version {
            display: block;
            margin-top: 8px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            color: var(--cyan);
            letter-spacing: 1px;
        }
        .lede-sub { margin-top: 14px; font-size: 1rem; color: var(--ink-dim); }
        .lede-sub strong { color: var(--ink); }

        /* ── Three ways in. Presented as equals so the survey reads as an
              invitation rather than a toll gate; only the weighting differs. */
        .path-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
            margin: 34px auto 0;
            max-width: 940px;
            text-align: left;
        }
        .path-card {
            display: flex;
            flex-direction: column;
            gap: 7px;
            padding: 20px 20px 18px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: var(--panel);
            text-decoration: none;
            color: var(--ink-dim);
            transition: border-color 0.25s ease, transform 0.25s ease, box-shadow 0.25s ease;
        }
        .path-card:hover {
            border-color: var(--cyan);
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }
        .path-card strong {
            font-family: 'Chakra Petch', sans-serif;
            font-size: 1.02rem;
            color: var(--ink);
            line-height: 1.35;
        }
        .path-index {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            letter-spacing: 2px;
            color: var(--violet);
        }
        .path-note { font-size: 0.86rem; line-height: 1.5; }
        .path-go {
            margin-top: auto;
            padding-top: 10px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11.5px;
            color: var(--cyan);
            letter-spacing: 0.5px;
        }
        .path-card--primary {
            border-color: rgba(255,61,158,0.5);
            background: linear-gradient(160deg, rgba(255,61,158,0.10), var(--panel) 60%);
        }
        .path-card--primary .path-index { color: var(--magenta); }
        .path-card--primary:hover { border-color: var(--magenta); }
        .path-card--quiet { opacity: 0.82; }
        .path-card--quiet:hover { opacity: 1; }

        .promise-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
            margin: 26px 0 22px;
        }
        .promise-item {
            padding: 18px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: rgba(0,0,0,0.22);
            font-size: 0.88rem;
            line-height: 1.55;
        }
        .promise-item strong {
            display: block;
            margin-bottom: 7px;
            font-family: 'Chakra Petch', sans-serif;
            color: var(--cyan);
            font-size: 0.95rem;
        }

        /* Blocks that unlock mid-survey glide in rather than snapping. */
        /* Newly-unlocked blocks animate in from wherever the mascot currently
           is (--emerge-x/--emerge-y, set in JS right before reveal) rather
           than a generic glide — reads as the mascot generating the question,
           not a hidden div fading in on its own. Falls back to a plain
           downward glide (the old default values) if JS never set the vars,
           e.g. before the mascot has appeared at all yet. */
        .qblock[data-revealed] {
            animation: block-emerge 0.5s cubic-bezier(0.22, 0.9, 0.3, 1);
        }
        @keyframes block-emerge {
            from {
                opacity: 0;
                transform: translate(var(--emerge-x, 0px), var(--emerge-y, 14px)) scale(0.82);
            }
            to { opacity: 1; transform: none; }
        }

        @media (prefers-reduced-motion: reduce) {
            /* Spectre is genuinely clickable now (he opens/closes the bubble),
               so unlike the old pointer-mascot he keeps his pointer cursor
               here — the affordance is real regardless of motion settings.
               What does need suppressing is his idle drift. */
            .mascot.idle { animation: none; }
            .mascot { transition: none; }
            .start-survey { animation: none; }
            .qblock[data-revealed] { animation: none; }
            details.panel.collapsible[open] > .details-body { animation: none; }
            details.panel.collapsible .summary-toggle { transition: none; }
            .path-card:hover { transform: none; }
        }

        section.panel, details.panel {
            padding: 48px;
            background: var(--panel);
            border-radius: 14px;
            margin-bottom: 28px;
            border: 1px solid var(--line);
            backdrop-filter: blur(6px);
        }
        section.panel p, details.panel p { margin-bottom: 16px; }
        section.panel p:last-child, details.panel p:last-child { margin-bottom: 0; }

        /* ── Collapsible panels ──────────────────────────────────────────
           Used for the detail-heavy sections (methodology, comparisons,
           dependencies) so the page reads short by default without losing
           any of the content — native <details>, so it's keyboard- and
           screen-reader-operable with zero extra JS. */
        details.panel.collapsible { padding: 0; }
        details.panel.collapsible > summary {
            list-style: none;
            cursor: pointer;
            padding: 40px 48px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }
        details.panel.collapsible > summary::-webkit-details-marker { display: none; }
        details.panel.collapsible > summary:hover .summary-text h2 { color: var(--cyan); }
        details.panel.collapsible .summary-text h2 { margin: 0 0 6px; }
        details.panel.collapsible .summary-teaser { font-size: 0.88rem; color: var(--ink-dim); margin: 0; }
        details.panel.collapsible .summary-toggle {
            flex-shrink: 0;
            width: 30px;
            height: 30px;
            border: 1px solid var(--line);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;

<!-- Existing page content omitted for brevity in this commit; retaining original content -->

<!-- Injected: simplified floating mascot behavior (restores gentle float, click = spin or teleport) -->
<style>
/* ---- Simplified mascot: gentle float + overrides ---- */
#mascot.mascot {
  position: fixed;
  width: 140px;
  z-index: 12000;
  cursor: pointer;
  user-select: none;
  /* initial position (JS will adjust on load) */
  left: auto;
  top: auto;
  bottom: 12vh;
  right: 2vw;
  transition: left 700ms cubic-bezier(.22,.9,.3,1), top 700ms cubic-bezier(.22,.9,.3,1), transform 300ms ease;
  will-change: left, top, transform;
  pointer-events: auto;
}

/* Keep the image sizing behavior */
#mascot.mascot img { width: 100%; height: auto; display: block; pointer-events: none; }

/* gentle vertical float when idle */
@keyframes gentle-float {
  0% { transform: translateY(0px); }
  50% { transform: translateY(-6px); }
  100% { transform: translateY(0px); }
}
#mascot.mascot.idle { animation: gentle-float 6s ease-in-out infinite; }

/* spin visual — toggled by JS */
#mascot.mascot img.spin-animate {
  transition: transform 0.6s ease-out;
  transform: rotate(360deg);
}

/* Respect user motion preferences */
@media (prefers-reduced-motion: reduce) {
  #mascot.mascot,
  #mascot.mascot.idle,
  #mascot.mascot img.spin-animate {
    animation: none !important;
    transition: none !important;
    transform: none !important;
  }
}
</style>

<script>
(function () {
  // Try to find the existing mascot element; if it's not present, create one.
  let mascot = document.getElementById('mascot');
  if (!mascot) {
    mascot = document.createElement('div');
    mascot.id = 'mascot';
    document.body.appendChild(mascot);
  }

  // Normalize the mascot markup to a simple image-only element.
  mascot.classList.add('mascot');
  mascot.setAttribute('title', 'Click me');
  mascot.setAttribute('aria-hidden', 'false');
  mascot.innerHTML = '<img src="Spectre.png" alt="Mascot">';

  const img = mascot.querySelector('img');
  const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (!prefersReduced) mascot.classList.add('idle');

  // Ensure initial position is on-screen (if earlier CSS left it anchored)
  function placeInitial() {
    const padding = 12;
    const w = window.innerWidth - mascot.offsetWidth - padding;
    const h = window.innerHeight - mascot.offsetHeight - padding;
    const initX = Math.max(padding, Math.min(w, window.innerWidth - mascot.offsetWidth - Math.round(window.innerWidth * 0.02)));
    const initY = Math.max(padding, Math.min(h, Math.round(window.innerHeight * 0.88) - mascot.offsetHeight));
    mascot.style.left = initX + 'px';
    mascot.style.top = initY + 'px';
  }

  let driftTimer = null;
  function scheduleDrift() {
    if (prefersReduced) return;
    clearTimeout(driftTimer);
    const delay = 6000 + Math.random() * 8000; // 6–14s
    driftTimer = setTimeout(() => {
      const padding = 12;
      const w = window.innerWidth - mascot.offsetWidth - padding * 2;
      const h = window.innerHeight - mascot.offsetHeight - padding * 2;
      const x = padding + Math.random() * Math.max(0, w);
      const y = padding + Math.random() * Math.max(0, h);
      mascot.style.left = Math.round(x) + 'px';
      mascot.style.top = Math.round(y) + 'px';
      scheduleDrift();
    }, delay);
  }

  function handleClick(e) {
    clearTimeout(driftTimer);
    if (Math.random() < 0.5) {
      // spin
      img.classList.add('spin-animate');
      img.addEventListener('transitionend', function removeSpin() {
        img.classList.remove('spin-animate');
        img.removeEventListener('transitionend', removeSpin);
      });
    } else {
      // teleport to a new random spot (instant)
      const padding = 18;
      const w = window.innerWidth - mascot.offsetWidth - padding * 2;
      const h = window.innerHeight - mascot.offsetHeight - padding * 2;
      const x = padding + Math.random() * Math.max(0, w);
      const y = padding + Math.random() * Math.max(0, h);
      mascot.style.left = Math.round(x) + 'px';
      mascot.style.top = Math.round(y) + 'px';
    }

    // resume drifting shortly after click (so user sees the result)
    setTimeout(() => scheduleDrift(), 1200);
  }

  function handleResize() {
    clearTimeout(driftTimer);
    const padding = 12;
    const currentLeft = parseInt(mascot.style.left || 0, 10);
    const currentTop = parseInt(mascot.style.top || 0, 10);
    const maxX = Math.max(padding, window.innerWidth - mascot.offsetWidth - padding);
    const maxY = Math.max(padding, window.innerHeight - mascot.offsetHeight - padding);
    if (currentLeft > maxX) mascot.style.left = maxX + 'px';
    if (currentTop > maxY) mascot.style.top = maxY + 'px';
    scheduleDrift();
  }

  // Init
  // Delay initial placement until image has a size
  if (img.complete) {
    placeInitial();
    scheduleDrift();
  } else {
    img.addEventListener('load', () => {
      placeInitial();
      scheduleDrift();
    });
  }

  mascot.addEventListener('click', handleClick);
  window.addEventListener('resize', handleResize);

  // Remove survey-related classes that may have been added previously
  mascot.classList.remove('open', 'narrated', 'hint');

})();
</script>
