<!-- Floating mascot behavior (keeps survey bubble but disables mascot click from opening it) -->
<style>
/* Small overrides to ensure gentle float + spin visual when used alongside existing CSS */
#mascot.mascot { transition: left 700ms cubic-bezier(.22,.9,.3,1), top 700ms cubic-bezier(.22,.9,.3,1), transform 300ms ease; will-change: left, top, transform; }
#mascot.mascot img.spin-animate { transition: transform 0.6s ease-out; transform: rotate(360deg); }
@keyframes gentle-float { 0%{transform:translateY(0);}50%{transform:translateY(-6px);}100%{transform:translateY(0);} }
#mascot.mascot.idle { animation: gentle-float 6s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) { #mascot.mascot, #mascot.mascot.idle, #mascot.mascot img.spin-animate { animation: none !important; transition: none !important; transform: none !important; } }
</style>

<script>
(function(){
  const mascot = document.getElementById('mascot');
  if (!mascot) return;
  const img = mascot.querySelector('#mascot-img') || mascot.querySelector('img');
  const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Ensure idle class if allowed
  if (!prefersReduced) mascot.classList.add('idle');

  // Place initial on-screen if CSS previously anchored it off-screen
  function placeInitial(){
    const padding = 12;
    const w = window.innerWidth - mascot.offsetWidth - padding;
    const h = window.innerHeight - mascot.offsetHeight - padding;
    const initX = Math.max(padding, Math.min(w, window.innerWidth - mascot.offsetWidth - Math.round(window.innerWidth * 0.02)));
    const initY = Math.max(padding, Math.min(h, Math.round(window.innerHeight * 0.88) - mascot.offsetHeight));
    mascot.style.left = initX + 'px';
    mascot.style.top = initY + 'px';
  }

  // Drift scheduling (only when bubble is closed)
  let driftTimer = null;
  function scheduleDrift(){
    if (prefersReduced) return;
    clearTimeout(driftTimer);
    const delay = 6000 + Math.random()*8000; // 6–14s
    driftTimer = setTimeout(()=>{
      // only drift if bubble not open
      if (!mascot.classList.contains('open')){
        const padding = 12;
        const w = window.innerWidth - mascot.offsetWidth - padding*2;
        const h = window.innerHeight - mascot.offsetHeight - padding*2;
        const x = padding + Math.random()*Math.max(0,w);
        const y = padding + Math.random()*Math.max(0,h);
        mascot.style.left = Math.round(x) + 'px';
        mascot.style.top = Math.round(y) + 'px';
      }
      scheduleDrift();
    }, delay);
  }

  // Click: stop other handlers (prevents mascot from opening bubble) and do spin or teleport
  function onClick(e){
    // prevent survey scripts from handling this click
    e.stopImmediatePropagation();
    // clear any scheduled drift so click action is visible
    clearTimeout(driftTimer);

    if (Math.random() < 0.5){
      // spin
      if (img){
        img.classList.add('spin-animate');
        img.addEventListener('transitionend', function cleanup(){ img.classList.remove('spin-animate'); img.removeEventListener('transitionend', cleanup); });
      }
    } else {
      // teleport instantly
      const padding = 18;
      const w = window.innerWidth - mascot.offsetWidth - padding*2;
      const h = window.innerHeight - mascot.offsetHeight - padding*2;
      const x = padding + Math.random()*Math.max(0,w);
      const y = padding + Math.random()*Math.max(0,h);
      mascot.style.left = Math.round(x) + 'px';
      mascot.style.top = Math.round(y) + 'px';
    }

    // restart drifting shortly after
    setTimeout(()=>scheduleDrift(), 1200);
  }

  // Keep the mascot inside viewport on resize
  function onResize(){
    clearTimeout(driftTimer);
    const padding = 12;
    const currentLeft = parseInt(mascot.style.left || 0,10);
    const currentTop = parseInt(mascot.style.top || 0,10);
    const maxX = Math.max(padding, window.innerWidth - mascot.offsetWidth - padding);
    const maxY = Math.max(padding, window.innerHeight - mascot.offsetHeight - padding);
    if (currentLeft > maxX) mascot.style.left = maxX + 'px';
    if (currentTop > maxY) mascot.style.top = maxY + 'px';
    scheduleDrift();
  }

  // Attach handlers
  mascot.addEventListener('click', onClick);
  window.addEventListener('resize', onResize);

  // Init placement once image has size
  if (img && img.complete){ placeInitial(); scheduleDrift(); }
  else if (img){ img.addEventListener('load', ()=>{ placeInitial(); scheduleDrift(); }); }
  else { placeInitial(); scheduleDrift(); }

  // Ensure survey can still be opened from the start-survey button
  const startBtn = document.getElementById('start-survey-btn');
  if (startBtn){
    // leave existing survey logic alone — this button should keep its handlers
    // but ensure it focuses the bubble when opening if some code toggles .open
    startBtn.addEventListener('click', ()=>{
      // nothing forced here; we simply make sure drift pauses while bubble open
      // the survey logic elsewhere should toggle mascot.classList.add('open')
      clearTimeout(driftTimer);
    });
  }

})();
</script>

<script>
(function () {
    // 'survey_start' — fires once, on the first checkbox/radio/field change

        form.addEventListener('change', function () {

        }, { once: true });
    }
})();
