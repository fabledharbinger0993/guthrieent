<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Osos Discos — Cameron Kelly & Marshall T · Philadelphia DJs</title>
  <meta name="description" content="Osos Discos — Cameron Kelly & Marshall T. Philadelphia DJ duo and event sound. Book a consult or build your own gear package." />
  <link rel="canonical" href="https://guthrieent.com/" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://guthrieent.com/" />
  <meta property="og:title" content="Osos Discos — Cameron Kelly & Marshall T" />
  <meta property="og:description" content="Philadelphia DJ duo and event sound. Book a consult or build your own gear package." />
  <meta property="og:image" content="https://guthrieent.com/og-image.jpg" />
  <meta property="og:image:alt" content="Osos Discos — disco statues bathed in colored light" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Osos Discos — Cameron Kelly & Marshall T" />
  <meta name="twitter:description" content="Philadelphia DJ duo and event sound. Book a consult or build your own gear package." />
  <meta name="twitter:image" content="https://guthrieent.com/og-image.jpg" />

  <link rel="icon" type="image/png" href="assets/logo-osos.png" />
  <link rel="apple-touch-icon" href="assets/logo-osos.png" />

  <style>
    :root {
      --w:       28vw;
      --gap:     0.70vw;
      --logo:    32vw;
      --guthrie: 14vw;
      --gw-w:    22vw;
      --gw-h:    76vh;
      --pink:    #ff2f92;
      --cyan:    #29e5ff;
      --gold:    #ffc94d;
      --ink:     #0b0713;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      background: #000;
      overflow-x: hidden;
    }

    /* ── BACKGROUND ─────────────────────────────────────── */
    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
      background-color: var(--ink);
      background-image:
        radial-gradient(circle at 18% 18%, rgba(255,47,146,0.32) 0%, transparent 32%),
        radial-gradient(circle at 82% 20%, rgba(41,229,255,0.23) 0%, transparent 30%),
        radial-gradient(circle at 52% 84%, rgba(255,201,77,0.20) 0%, transparent 34%),
        linear-gradient(135deg, rgba(11,7,19,0.40), rgba(0,0,0,0.76)),
        image-set(url('/assets/bg-statue-aura.jpg') type('image/jpeg'), url('/assets/bg-statue-aura.png') type('image/png'));
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
    }

    .bg::before, .bg::after {
      content: "";
      position: absolute;
      inset: -20%;
      pointer-events: none;
    }

    .bg::before {
      opacity: 0.18;
      background-image:
        linear-gradient(rgba(255,255,255,0.12) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.12) 1px, transparent 1px);
      background-size: 48px 48px;
      transform: rotate(-8deg) scale(1.1);
    }

    .bg::after {
      background:
        linear-gradient(90deg, rgba(0,0,0,0.85), transparent 18%, transparent 82%, rgba(0,0,0,0.85)),
        radial-gradient(ellipse at center, transparent 0%, rgba(0,0,0,0.62) 72%);
    }

    .bg-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 0.8s ease;
    }
    .bg-video.ready { opacity: 1; }

    @media (max-width: 600px) {
      .bg {
        background-image:
          radial-gradient(ellipse at 50% 20%, rgba(232, 189, 117, 0.22) 0%, rgba(111, 81, 49, 0.24) 55%, rgba(22, 14, 8, 0.5) 100%),
          image-set(url('/assets/bg-statue-aura.jpg') type('image/jpeg'), url('/assets/bg-statue-aura.png') type('image/png'));
      }
      .bg-video { display: none; }
    }

    /* ── CONTENT COLUMN ─────────────────────────────────── */
    .content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      width: var(--w);
      margin: 0 auto;
      padding: clamp(28px, 5vw, 64px) 0;
      gap: var(--gap);
      filter: drop-shadow(0 22px 42px rgba(0,0,0,0.72));
    }

    .el     { display: block; flex-shrink: 0; }
    .el img { display: block; width: 100%; height: auto; }

    .logo {
      position: relative;
      width: var(--logo);
      transform: rotate(-2deg);
      filter: drop-shadow(0 0 28px rgba(255,47,146,0.42));
    }
    .full         { width: var(--w); }
    .logo-guthrie { width: var(--guthrie); }
    .logo-guthrie img { display: block; width: 100%; height: auto; }

    .icon-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--gap);
      width: var(--w);
    }
    .icon-row a { display: block; flex: 1; }
    .icon-row a img { display: block; width: 100%; height: auto; }

    .interactive {
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.10s ease, filter 0.10s ease;
    }
    .interactive:hover {
      filter: brightness(1.22) saturate(1.18) drop-shadow(0 0 18px rgba(41,229,255,0.55));
      transform: scale(1.035) rotate(-1deg);
    }
    .interactive:active {
      transform: scale(0.93);
      filter: brightness(0.68);
      transition-duration: 0.05s;
    }

    /* ── FABLEGEAR BUTTON ────────────────────────────────── */
    .fablegear-wrap {
      position: relative;
      width: calc(var(--guthrie) * 0.72);
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
    }
    .fablegear-wrap img { display: block; width: 100%; height: auto; }

    /* ── FABLEGEAR POPUP MODAL ───────────────────────────── */
    .rkb-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(4,2,12,0.72);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      align-items: center;
      justify-content: center;
    }
    .rkb-overlay.open { display: flex; }

    .rkb-modal {
      position: relative;
      width: clamp(260px, 34vw, 380px);
      background: rgba(14,10,28,0.98);
      border: 1px solid rgba(140,100,255,0.4);
      border-radius: 18px;
      padding: 28px 24px 22px;
      box-shadow: 0 8px 48px rgba(80,40,180,0.45), 0 0 0 1px rgba(200,180,255,0.06);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .rkb-close {
      position: absolute;
      top: 12px; right: 16px;
      background: none;
      border: none;
      color: rgba(180,160,255,0.6);
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 6px;
      transition: color 0.12s ease, background 0.12s ease;
    }
    .rkb-close:hover { color: #c4b5fd; background: rgba(140,100,255,0.12); }

    .rkb-modal h3 {
      font-family: system-ui, sans-serif;
      font-size: clamp(13px, 1.4vw, 16px);
      font-weight: 700;
      color: #c4b5fd;
      letter-spacing: 0.07em;
      text-align: center;
      margin: 0;
    }

    .rkb-modal p {
      font-family: system-ui, sans-serif;
      font-size: clamp(11px, 1.1vw, 13px);
      color: rgba(210,205,235,0.82);
      line-height: 1.65;
      text-align: center;
      margin: 0;
    }

    .rkb-download {
      display: block;
      width: clamp(140px, 18vw, 210px);
      transition: transform 0.10s ease, filter 0.10s ease;
    }
    .rkb-download img { display: block; width: 100%; height: auto; }
    .rkb-download:hover {
      filter: brightness(1.2) drop-shadow(0 0 12px rgba(140,100,255,0.7));
      transform: scale(1.04);
    }
    .rkb-download:active { transform: scale(0.93); filter: brightness(0.7); transition-duration: 0.05s; }

    @media (max-width: 600px) {
      .rkb-modal { width: clamp(260px, 86vw, 360px); padding: 24px 18px 20px; }
      .rkb-download { width: clamp(130px, 52vw, 200px); }
    }

    /* ═══════════════════════════════════════════════════════
       COLLAGE CLOUDS (left + right of central column)
       Images overlap like pasted gig flyers instead of sitting in frames.
       ═══════════════════════════════════════════════════════ */
    .gallery-window {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      width: var(--gw-w);
      height: var(--gw-h);
      z-index: 2;
      pointer-events: auto;
      opacity: 0;
      transition: opacity 0.6s ease;
    }
    .gallery-window.ready { opacity: 1; }
    .gallery-left  { left:  2.2vw; }
    .gallery-right { right: 2.2vw; }

    .gw-bar {
      position: absolute;
      z-index: 4;
      top: 2%;
      left: 50%;
      transform: translateX(-50%) rotate(-2deg);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
      background: rgba(11, 7, 19, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: 0 10px 24px rgba(0,0,0,0.42), 0 0 18px rgba(255,47,146,0.24);
      backdrop-filter: blur(8px) saturate(1.3);
      -webkit-backdrop-filter: blur(8px) saturate(1.3);
    }

    .gw-title {
      font-family: 'DM Mono', ui-monospace, monospace;
      font-size: 10px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.86);
      white-space: nowrap;
    }

    .gw-toggle {
      background: var(--pink);
      border: 0;
      color: #120715;
      width: 22px;
      height: 22px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 10px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      box-shadow: 0 0 18px rgba(255,47,146,0.45);
    }
    .gw-toggle:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

    .gw-viewport {
      position: absolute;
      inset: 0;
      overflow: visible;
    }

    .gw-strip {
      position: relative;
      width: 100%;
      height: 100%;
      animation: collage-float 12s ease-in-out infinite alternate;
      will-change: transform;
    }
    .gallery-right .gw-strip { animation-delay: -4s; animation-direction: alternate-reverse; }
    .gallery-window[data-paused="true"] .gw-strip { animation-play-state: paused; }

    .gw-strip img {
      position: absolute;
      display: block;
      width: clamp(118px, 13vw, 235px);
      aspect-ratio: 4 / 5;
      object-fit: cover;
      border-radius: 2px 18px 4px 14px;
      border: 2px solid rgba(255,255,255,0.18);
      box-shadow:
        0 18px 34px rgba(0,0,0,0.62),
        0 0 0 8px rgba(255,255,255,0.025),
        0 0 30px rgba(41,229,255,0.16);
      filter: saturate(1.18) contrast(1.08);
      clip-path: polygon(3% 5%, 96% 0, 100% 91%, 88% 100%, 5% 96%, 0 18%);
    }
    .gw-strip img::selection { background: transparent; }
    .gw-strip img:nth-child(6n+1) { top: 4%;  left: 11%; transform: rotate(-9deg);  z-index: 2; }
    .gw-strip img:nth-child(6n+2) { top: 18%; left: 44%; transform: rotate(8deg);   z-index: 3; width: clamp(136px, 15vw, 265px); }
    .gw-strip img:nth-child(6n+3) { top: 40%; left: 4%;  transform: rotate(6deg);   z-index: 1; aspect-ratio: 16 / 11; }
    .gw-strip img:nth-child(6n+4) { top: 53%; left: 39%; transform: rotate(-6deg);  z-index: 4; }
    .gw-strip img:nth-child(6n+5) { top: 70%; left: 15%; transform: rotate(11deg);  z-index: 2; width: clamp(112px, 12vw, 220px); }
    .gw-strip img:nth-child(6n+6) { top: 30%; left: 24%; transform: rotate(-15deg); z-index: 0; opacity: .72; }

    .gallery-right .gw-strip img:nth-child(6n+1) { left: 38%; transform: rotate(10deg); }
    .gallery-right .gw-strip img:nth-child(6n+2) { left: 2%;  transform: rotate(-7deg); }
    .gallery-right .gw-strip img:nth-child(6n+3) { left: 24%; transform: rotate(14deg); }
    .gallery-right .gw-strip img:nth-child(6n+4) { left: 0;   transform: rotate(-10deg); }

    .gw-strip::before, .gw-strip::after {
      content: "";
      position: absolute;
      z-index: 5;
      pointer-events: none;
      mix-blend-mode: screen;
    }
    .gw-strip::before {
      inset: 7% 4% auto auto;
      width: 48%;
      height: 16px;
      background: linear-gradient(90deg, transparent, var(--cyan), transparent);
      transform: rotate(-18deg);
      opacity: .65;
    }
    .gw-strip::after {
      left: 8%;
      bottom: 5%;
      width: 56%;
      height: 56%;
      border: 2px dashed rgba(255,201,77,0.38);
      border-radius: 50%;
      opacity: .42;
    }

    @keyframes collage-float {
      from { transform: translateY(-1.5%) rotate(-.6deg) scale(1); }
      to   { transform: translateY(1.8%) rotate(.8deg) scale(1.015); }
    }

    @media (max-width: 1100px) { .gallery-window { display: none; } }
    @media (prefers-reduced-motion: reduce) { .gw-strip { animation: none; } }

    /* ── MOBILE ─────────────────────────────────────────── */
    @media (max-width: 600px) {
      :root {
        --w:       88vw;
        --gap:     2.5vw;
        --logo:    104vw;
        --guthrie: 44vw;
      }
      .content {
        min-height: auto;
        padding: 6vw 0 10vw;
        justify-content: flex-start;
      }
      .fablegear-wrap { width: calc(var(--guthrie) * 0.72); }
    }
  </style>
</head>
<body>

  <div class="bg">
    <!-- Drop a `hero-bg.mp4` in the repo root to enable. Falls back to icon-bg-phone.png automatically. -->
    <video class="bg-video" id="bgVideo" autoplay muted loop playsinline preload="metadata" poster="/assets/icon-bg-phone.webp">
      <source src="hero-bg.mp4" type="video/mp4" />
    </video>
  </div>

  <!-- ═══ LEFT GALLERY WINDOW ═══ -->
  <aside class="gallery-window gallery-left" id="galleryLeft" aria-label="Photo gallery (left)" data-paused="false">
    <div class="gw-bar">
      <span class="gw-title">Pasted · Parties</span>
      <button class="gw-toggle" type="button" aria-label="Pause gallery" data-target="galleryLeft">⏸</button>
    </div>
    <div class="gw-viewport"><div class="gw-strip" id="stripLeft"></div></div>
  </aside>

  <!-- ═══ RIGHT GALLERY WINDOW ═══ -->
  <aside class="gallery-window gallery-right" id="galleryRight" aria-label="Photo gallery (right)" data-paused="false">
    <div class="gw-bar">
      <span class="gw-title">Flyers · Frequencies</span>
      <button class="gw-toggle" type="button" aria-label="Pause gallery" data-target="galleryRight">⏸</button>
    </div>
    <div class="gw-viewport"><div class="gw-strip" id="stripRight"></div></div>
  </aside>

  <div class="content">

    <a class="el logo" aria-label="Osos Discos">
      <img src="assets/logo-osos.png" alt="Osos Discos" />
    </a>

    <a class="el full interactive" href="https://www.instagram.com/camalama/" target="_blank" rel="noopener" aria-label="Cameron on Instagram">
      <img src="assets/icon-instagram-cameron.png" alt="" />
    </a>

    <a class="el full interactive" href="https://www.instagram.com/djmarshall.t/" target="_blank" rel="noopener" aria-label="Marshall on Instagram">
      <img src="assets/icon-instagram-marshall.png" alt="" />
    </a>

    <div class="icon-row">
      <a class="interactive" href="gear.html" aria-label="Build your gear package">
        <img src="assets/btn-gear.png" alt="Gear Builder" />
      </a>
      <a class="interactive" href="consult.html" aria-label="Request a consult">
        <img src="assets/btn-booker.png" alt="Event Consult" />
      </a>
    </div>

    <div class="icon-row">
      <a class="interactive" href="https://www.twitch.tv/chefcamalama" target="_blank" rel="noopener" aria-label="Twitch">
        <img src="assets/icon-twitch.png" alt="" />
      </a>
      <a class="interactive" href="https://soundcloud.com/kineticnola" target="_blank" rel="noopener" aria-label="SoundCloud">
        <img src="assets/icon-soundcloud.png" alt="" />
      </a>
      <a class="interactive" href="https://www.facebook.com/DjCameronKelly/" target="_blank" rel="noopener" aria-label="Facebook">
        <img src="assets/icon-facebook-cameron.png" alt="" />
      </a>
    </div>

    <a class="el logo-guthrie interactive" href="consult.html" aria-label="Guthrie Entertainment — book a consult">
      <img src="assets/logo-guthrie.png" alt="Guthrie Entertainment" />
    </a>
    
    <a href="fablegear.html"
       class="fablegear-wrap interactive"
       aria-label="Learn about FableGear">
      <img src="assets/FableGear-logo.png" alt="FableGear" />
    </a>

  </div>
  <script>
    /* ── HERO VIDEO ───────────────────────────────────────
       If hero-bg.mp4 exists, fade it in over the poster.
       If not (404 or codec failure), leave the static background. */
    (function () {
      const v = document.getElementById('bgVideo');
      if (!v) return;
      v.addEventListener('canplay', () => v.classList.add('ready'), { once: true });
      v.addEventListener('error', () => v.remove());
      // If no <source> resolves, the video silently has no readyState — clean up.
      setTimeout(() => { if (v.readyState === 0) v.remove(); }, 3000);
    })();

    /* ── GALLERY ──────────────────────────────────────────
       Populate by editing the GALLERY arrays below.
       Drop your images in /assets/gallery/ then list the filenames here.
       Missing images are removed automatically — the gallery hides
       itself entirely if no images load. */
    (function () {
      const GALLERY = {
        left: [
          'assets/gallery/mix-lab-cameron.jpg',
          'assets/gallery/fishbowl-ufo.jpg',
          'assets/gallery/dancefloor-wide.jpg',
          'assets/gallery/marshall-red-room.jpg',
          'assets/gallery/mix-lab-marshall.jpg',
          'assets/gallery/wkdu-freak-flag.jpg',
        ],
        right: [
          'assets/gallery/marshall-orange-booth.jpg',
          'assets/gallery/disco-ball-room.jpg',
          'assets/gallery/cameron-black-white.jpg',
          'assets/gallery/cameron-tent-decks.jpg',
          'assets/gallery/revibe-penn-treaty.jpg',
          'assets/gallery/fishbowl-ufo.jpg',
        ],
      };

      function mount(stripId, windowId, sources) {
        const strip = document.getElementById(stripId);
        const win   = document.getElementById(windowId);
        if (!strip || !win) return;

        let loaded = 0;
        const total = sources.length;
        const elements = [];

        sources.forEach((src, i) => {
          const img = new Image();
          img.alt = '';
          img.loading = i < 2 ? 'eager' : 'lazy';
          img.decoding = 'async';
          img.src = src;
          img.onload = () => {
            elements.push(img);
            loaded++;
            if (loaded === total) finish();
          };
          img.onerror = () => {
            loaded++;
            if (loaded === total) finish();
          };
        });

        function finish() {
          if (elements.length === 0) {
            win.remove();
            return;
          }
          // Keep a single layered set: the CSS deliberately overlaps every image
          // into a loose, pasted-up collage rather than a scrolling picture frame.
          elements.forEach(el => strip.appendChild(el));
          win.classList.add('ready');
        }
      }

      mount('stripLeft',  'galleryLeft',  GALLERY.left);
      mount('stripRight', 'galleryRight', GALLERY.right);

      // Play/pause toggles
      document.querySelectorAll('.gw-toggle').forEach(btn => {
        btn.addEventListener('click', () => {
          const win = document.getElementById(btn.dataset.target);
          if (!win) return;
          const paused = win.dataset.paused === 'true';
          win.dataset.paused = String(!paused);
          btn.textContent = paused ? '⏸' : '▶';
          btn.setAttribute('aria-label', paused ? 'Pause gallery' : 'Play gallery');
        });
      });
    })();
  </script>
  <script src="track.js" defer></script>
</body>
</html>
