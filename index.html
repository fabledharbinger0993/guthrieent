<head>

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://guthrieent.com/" />
  <meta property="og:title" content="Osos Discos — Cameron Kelly & Marshall T" />
  <meta property="og:description" content="Philadelphia DJ duo and event sound. Book a consult or build your own gear package." />
  <meta property="og:image" content="https://guthrieent.com/assets/og-image.jpg" />
  <meta property="og:image:alt" content="Osos Discos — disco statues bathed in colored light" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Osos Discos — Cameron Kelly & Marshall T" />
  <meta name="twitter:description" content="Philadelphia DJ duo and event sound. Book a consult or build your own gear package." />
  <meta name="twitter:image" content="https://guthrieent.com/assets/og-image.jpg" />

  <link rel="icon" type="image/png" href="assets/logo-osos.png" />
  <link rel="apple-touch-icon" href="assets/logo-osos.png" />

  <link rel="preload" as="image" href="/assets/home/logo-osos.webp" type="image/webp" />

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      background: #0a0418;
      overflow-x: hidden;
    }

    .visually-hidden {
      position: absolute;
      width: 1px; height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    /* ── BACKGROUND ─────────────────────────────────────────
       Two crops of the same scene. The phone crop is used whenever the
       stacked layout is (same media query as .stage below), so the
       buttons never sit over a background framed for the other shape. */
    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
      background-color: #0a0418;
      background-image: image-set(url('/assets/home/bg-phone.webp') type('image/webp'), url('/assets/home/bg-phone.jpg') type('image/jpeg'));
      background-position: center top;
      background-size: cover;
      background-repeat: no-repeat;
    }

    .bg-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 0.8s ease;
    }
    .bg-video.ready { opacity: 1; }

    /* ── BUTTONS ────────────────────────────────────────── */
    .item { display: block; }
    .item img { display: block; width: 100%; height: auto; }

    .interactive {
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.10s ease, filter 0.10s ease;
    }
    .interactive:hover {
      filter: brightness(1.15) drop-shadow(0 0 14px rgba(255, 90, 220, 0.6));
      transform: scale(1.035);
    }
    .interactive:active {
      transform: scale(0.93);
      filter: brightness(0.68);
      transition-duration: 0.05s;
    }
    .interactive:focus-visible {
      outline: 2px solid #7ef9ff;
      outline-offset: 4px;
      border-radius: 10px;
    }

    .socials {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .socials img { display: block; width: 100%; height: auto; }

    /* ── PHONE / PORTRAIT: stacked grid ──────────────────────
       Follows "phone reference.png": FableGear and EPK side by side,
       Gear then Event, socials 2×2 (RA, Facebook / Twitch, SoundCloud),
       and the logo last with each Instagram icon beside its owner's face. */
    .stage {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-areas:
        "fable epk"
        "gear  gear"
        "event event"
        "soc   soc"
        "logo  logo";
      align-items: center;
      justify-items: center;
      gap: 16px 12px;
      width: min(100% - 32px, 520px);
      margin: 0 auto;
      padding: 24px 0 16px;
    }
    .fable  { grid-area: fable; width: 72%; }
    .epk    { grid-area: epk;   width: 66%; }
    .gear   { grid-area: gear;  width: 60%; }
    .event  { grid-area: event; width: 56%; }
    .socials { grid-area: soc;  width: 46%; }
    .logo   { grid-area: logo;  width: 100%; margin-top: 4%; }
    .ig-c, .ig-m {
      grid-area: logo;
      align-self: start;
      width: 19%;
      margin-top: 18%;
      z-index: 1;
    }
    .ig-c { justify-self: start; margin-left: 2%; }
    .ig-m { justify-self: end;   margin-right: 2%; }
    .s-ra { order: 1; }
    .s-fb { order: 2; }
    .s-tw { order: 3; }
    .s-sc { order: 4; }

    /* ── TIP JAR (Venmo QR) ──────────────────────────────── */
    .tip-jar {
      position: relative;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      width: max-content;
      margin: 8px auto 28px;
      padding: 8px 8px 6px;
      background: rgba(255, 255, 255, 0.94);
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.45);
      text-decoration: none;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }
    .tip-jar:hover {
      transform: scale(1.04);
      box-shadow: 0 6px 26px rgba(0, 0, 0, 0.55);
    }
    .tip-jar:active {
      transform: scale(0.95);
      transition-duration: 0.05s;
    }
    .tip-jar-label {
      font-family: system-ui, sans-serif;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #111;
      text-align: center;
      line-height: 1.2;
      white-space: nowrap;
    }
    .tip-jar-qr { display: block; width: 58px; height: 58px; }

    /* ── WIDE SCREENS: the mockup's 16:9 composition ─────────
       The stage is the largest 16:9 box that fits the viewport, and every
       button is placed in % of that box, so the layout scales as one
       picture. Positions are measured off website-design.png (3840×2160):
       left = button centre, top = button top edge, width = button width. */
    @media (min-width: 768px) and (min-aspect-ratio: 4/3) {
      :root {
        --stage-w: min(100vw, 177.78vh);
        --stage-h: min(56.25vw, 100vh);
      }

      .bg {
        background-image: image-set(url('/assets/home/bg-desktop.webp') type('image/webp'), url('/assets/home/bg-desktop.jpg') type('image/jpeg'));
        background-position: center;
      }

      /* Centred with negative margins, not transform: a transformed
         ancestor would trap the position: fixed corner badges below. */
      .stage {
        display: block;
        position: absolute;
        top: 50%;
        left: 50%;
        width: var(--stage-w);
        height: var(--stage-h);
        margin: calc(var(--stage-h) / -2) 0 0 calc(var(--stage-w) / -2);
        padding: 0;
      }
      .stage > .item,
      .stage > .socials {
        position: absolute;
        left: var(--x);
        top: var(--y);
        width: var(--w);
        transform: translateX(-50%);
      }
      .stage > .interactive:hover  { transform: translateX(-50%) scale(1.035); }
      .stage > .interactive:active { transform: translateX(-50%) scale(0.93); }

      /* FableGear and EPK pin to the window corners, so on screens wider
         than 16:9 they sit at the edges instead of the stage's. Sized off
         the stage so they still scale with the rest of the picture. */
      .stage > .fable,
      .stage > .epk {
        position: fixed;
        top: calc(var(--stage-h) * 0.015);
        transform: none;
        z-index: 3;
      }
      .stage > .fable { left:  calc(var(--stage-w) * 0.006); width: calc(var(--stage-w) * 0.178); transform-origin: top left; }
      .stage > .epk   { left: auto; right: calc(var(--stage-w) * 0.008); width: calc(var(--stage-w) * 0.161); transform-origin: top right; }
      .stage > .fable:hover,  .stage > .epk:hover  { transform: scale(1.035); }
      .stage > .fable:active, .stage > .epk:active { transform: scale(0.93); }
      .logo    { --x: 50%;   --y: 22%;   --w: 44%; }
      .event   { --x: 23.5%; --y: 67.6%; --w: 17.8%; z-index: 1; }
      .gear    { --x: 76.2%; --y: 68.4%; --w: 18.8%; z-index: 1; }
      /* Instagram icons flank the logo beside each face, as on phones. */
      .ig-c    { --x: 31.5%; --y: 47%;   --w: 6.4%; margin: 0; z-index: 1; }
      .ig-m    { --x: 68.5%; --y: 47%;   --w: 6.4%; margin: 0; z-index: 1; }
      .logo    { margin: 0; }
      .socials { --x: 50%;   --y: 87.8%; --w: 29.6%; z-index: 1; display: flex; gap: 2.8%; }
      .socials a { flex: 0 0 auto; width: 17.9%; order: 0; }

      .tip-jar {
        position: fixed;
        left: 14px;
        bottom: 14px;
        margin: 0;
        padding: 10px 10px 8px;
      }
      .tip-jar-label { font-size: 10px; }
      .tip-jar-qr { width: 74px; height: 74px; }
    }

    @media (min-width: 768px) and (min-aspect-ratio: 4/3) and (max-height: 520px) {
      .tip-jar { display: none; }
    }

    @media (max-width: 600px) {
      .bg-video { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .interactive, .tip-jar { transition: none; }
    }
  </style>
</head>
<body>

  <a class="tip-jar" href="https://venmo.com/u/Totoro_mg" target="_blank" rel="noopener" aria-label="Tip the sound guy on Venmo">

  <script>
    /* ── HERO VIDEO ───────────────────────────────────────
       If hero-bg.mp4 exists, fade it in over the background.
       If not (404 or codec failure), leave the static background. */
    (function () {
      const v = document.getElementById('bgVideo');
      if (!v) return;
      v.addEventListener('canplay', () => v.classList.add('ready'), { once: true });
      v.addEventListener('error', () => v.remove());
      // If no <source> resolves, the video silently has no readyState — clean up.
      setTimeout(() => { if (v.readyState === 0) v.remove(); }, 3000);
    })();
  </script>
  <script src="track.js" defer></script>
