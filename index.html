  <link rel="apple-touch-icon" href="assets/logo-osos.png" />

  <link rel="preload" as="image" href="/assets/home/logo-ososdiscos.webp" type="image/webp" />

  <!-- Jost: a free Futura-style face, the closest match to the mockup's headlines.
       Allowed by the CSP in _headers (fonts.googleapis.com / fonts.gstatic.com). -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@1,800&display=swap" />

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      background: #000;
      overflow-x: hidden;
    }

    .visually-hidden {
      position: absolute;
      width: 1px; height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    img { display: block; width: 100%; height: auto; }

    /* ── INTRO ──────────────────────────────────────────────
       Starts black; the logo fades in first, then the rest of the scene.
       Opacity only, so it never fights the hover transforms below.
       fill-mode both holds everything at 0 until its turn: no flash. */
    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
    .logo  { animation: fade-in 400ms ease-out both; }
    .scene { animation: fade-in 300ms ease-out 350ms both; }

    /* ── BACKGROUND ───────────────────────────────────────── */
    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-color: #000;
      background-image: image-set(url('/assets/home/bg-phone-dark.webp') type('image/webp'), url('/assets/home/bg-phone-dark.jpg') type('image/jpeg'));
      background-position: center top;
      background-size: cover;
      background-repeat: no-repeat;
    }

    /* ── HEADLINES (real text, neon glow) ─────────────────── */
    .headline, .subhead, .connect-head {
      font-family: 'Jost', 'Futura', 'Century Gothic', system-ui, sans-serif;
      text-align: center;
      text-transform: uppercase;
      line-height: 1;
      white-space: nowrap;
    }
    /* Styles follow icon-text.png (Marshall's own export of the headlines). */
    .headline {
      font-weight: 800;
      font-style: italic;
      color: #ffe3fb;
      letter-spacing: 0.01em;
      text-shadow:
        0 0 0.05em #fff,
        0 0 0.16em #ff4cf0,
        0 0 0.4em #e21bd6,
        0 0 0.8em #a3009b;
    }
    .subhead, .connect-head {
      font-weight: 800;
      font-style: italic;
      color: #f2ffff;
      text-shadow:
        0 0 0.05em #fff,
        0 0 0.16em #39f3ff,
        0 0 0.4em #00c6e0,
        0.04em 0.06em 0.1em rgba(0, 0, 0, 0.9);
    }
    /* The dark rounded backing behind "WE CAN HELP WITH THAT!" */
    .subhead {
      background: rgba(4, 14, 16, 0.92);
      border-radius: 0.3em;
      padding: 0.06em 0.22em 0.08em;
      box-shadow: 0 0 0.25em rgba(0, 220, 240, 0.35);
    }

    /* ── LINKS / FOCUS ────────────────────────────────────── */
    a { -webkit-tap-highlight-color: transparent; }
    .src, .social { transition: transform 0.12s ease, filter 0.12s ease; }
    .social:hover, .reveal:hover .src, .reveal:focus-visible .src {
      filter: brightness(1.12) drop-shadow(0 0 14px rgba(255, 90, 220, 0.55));
      transform: scale(1.035);
    }
    .social:active, a.reveal:active .src {
      transform: scale(0.93);
      filter: brightness(0.7);
      transition-duration: 0.05s;
    }
    .reveal:focus-visible, .social:focus-visible {
      outline: 2px solid #7ef9ff;
      outline-offset: 4px;
      border-radius: 10px;
    }

    /* ── REVEALS: lime text slides out of its bar / button ───
       Each .reveal is one link (or, for the unlinked services bar, one
       focusable group) covering the source object AND the full footprint
       of its label, so hovering the empty space beside a bar opens it and
       moving onto the text doesn't flicker. The label sits in a .clip
       box whose inner edge runs under the source object (z-index above),
       so the text reads as emerging from behind it, not fading in place.
       Resting state is a transform, never display/visibility: the alt
       text stays readable for screen readers. */
    .reveal { display: block; position: relative; text-decoration: none; }
    .reveal .src  { position: relative; z-index: 2; }
    .reveal .clip { overflow: hidden; }
    .reveal .label {
      transition: transform 300ms cubic-bezier(0.2, 0.7, 0.2, 1);
    }

    .socials { display: flex; justify-content: center; }

    /* ── TIP JAR (Venmo QR) ──────────────────────────────── */
    .tip-jar {
      position: relative;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      width: max-content;
      margin: 8px auto 28px;
      padding: 8px 8px 6px;
      background: rgba(255, 255, 255, 0.94);
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.45);
      text-decoration: none;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }
    .tip-jar:hover { transform: scale(1.04); box-shadow: 0 6px 26px rgba(0, 0, 0, 0.55); }
    .tip-jar:active { transform: scale(0.95); transition-duration: 0.05s; }
    .tip-jar-label {
      font-family: system-ui, sans-serif;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #111;
      text-align: center;
      line-height: 1.2;
      white-space: nowrap;
    }
    .tip-jar-qr { display: block; width: 58px; height: 58px; }

    /* ── PHONE / PORTRAIT: stacked ───────────────────────────
       No hover on phones, so every lime label is simply shown beside its
       object (the spec's default for touch). */
    .stage {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      width: min(100% - 32px, 520px);
      margin: 0 auto;
      padding: 28px 0 12px;
    }
    .headline { font-size: clamp(26px, 8.4vw, 44px); }
    .subhead  { font-size: clamp(16px, 5vw, 26px); line-height: 1.05; }
    .connect-head { font-size: clamp(17px, 5.2vw, 27px); margin-top: 6px; }
    .logo { width: 92%; }

    .reveal { display: flex; align-items: center; gap: 4%; width: 100%; }
    .reveal .clip { overflow: visible; }
    .r-cal .src, .r-spk .src { flex: 0 0 34%; }
    .r-cal .clip, .r-spk .clip { flex: 0 0 52%; }
    .r-cal, .r-spk { justify-content: center; }
    .r-cal { flex-direction: row-reverse; }
    .r-bar .src { flex: 0 0 5.5%; }
    .r-bar .clip { flex: 0 0 40%; }
    .r-bar { justify-content: center; width: 82%; }
    .bars { display: grid; grid-template-columns: 1fr; justify-items: center; gap: 6px; width: 100%; }

    .socials { gap: 3%; width: 100%; }
    .social { flex: 0 0 17%; }

    /* ── WIDE SCREENS: the mockup's 16:9 composition ─────────
       The stage is the largest 16:9 box that fits the viewport. Every
       position below is in pixels of "website concept.png" (3840×2160),
       measured by diffing it against the bare background, then scaled by
       --u (one concept pixel). --l/--t/--w/--h = left/top/width/height. */
    @media (min-width: 768px) and (min-aspect-ratio: 4/3) {
      :root {
        --stage-w: min(100vw, 177.78vh);
        --stage-h: min(56.25vw, 100vh);
        --u: calc(var(--stage-w) / 3840);
      }

      .bg {
        background-image: image-set(url('/assets/home/bg-desktop-dark.webp') type('image/webp'), url('/assets/home/bg-desktop-dark.jpg') type('image/jpeg'));
        background-position: center;
      }

      .stage {
        display: block;
        position: absolute;
        top: 50%;
        left: 50%;
        width: var(--stage-w);
        height: var(--stage-h);
        margin: calc(var(--stage-h) / -2) 0 0 calc(var(--stage-w) / -2);
        padding: 0;
      }
      .stage .at, .stage .reveal, .reveal .src, .reveal .clip, .reveal .label {
        position: absolute;
        left: calc(var(--l, 0) * var(--u));
        top: calc(var(--t, 0) * var(--u));
        width: calc(var(--w) * var(--u));
      }
      /* Custom properties inherit, so without these resets a child with no
         --t of its own would pick up its .reveal's offset and be pushed
         down by it twice. */
      .reveal .src, .reveal .clip, .reveal .label { --l: 0; --t: 0; }
      .reveal, .reveal .clip { height: calc(var(--h) * var(--u)); }
      .reveal { display: block; flex: none; }
      .reveal .clip { overflow: hidden; z-index: 1; }

      /* Text centred on a measured x, top-aligned to its measured cap line. */
      .headline, .subhead, .connect-head {
        position: absolute;
        left: calc(var(--x) * var(--u));
        top: calc(var(--t) * var(--u));
        transform: translateX(-50%);
        margin: 0;
      }
      .headline     { --x: 2030; --t: 56;   font-size: calc(206 * var(--u)); }
      .subhead      { --x: 1920; --t: 258;  font-size: calc(104 * var(--u)); line-height: 0.85; }
      .connect-head { --x: 1924; --t: 2028; font-size: calc(140 * var(--u)); }

      .logo { --l: 1211; --t: 298; --w: 1418; }

      /* Bars: bar at the left edge, label emerges rightwards from it. */
      .r-services  { --l: 43; --t: 58;   --w: 703; --h: 657; }
      .r-fablegear { --l: 43; --t: 762;  --w: 485; --h: 657; }
      .r-epk       { --l: 43; --t: 1450; --w: 440; --h: 695; }
      .r-bar .src  { --l: 0; --w: 82; }
      .r-epk .src  { --t: 18; }
      .r-bar .clip { --l: 62; --t: 0; }
      .r-services .clip  { --w: 641; }
      .r-fablegear .clip { --w: 423; }
      .r-epk .clip       { --w: 378; }
      .r-services .label  { --l: -35; --t: 35; --w: 676; }
      .r-fablegear .label { --l: -29; --t: 6;  --w: 452; }
      .r-epk .label       { --l: -8;  --t: 0;  --w: 386; }
      .r-bar .label { transform: translateX(-108%); }

      /* Calendar: label emerges leftwards from behind the button. */
      .r-cal        { --l: 1067; --t: 1346; --w: 864; --h: 382; }
      .r-cal .src   { --l: 482; --t: 0; --w: 382; }
      .r-cal .clip  { --l: 0;   --t: 0; --w: 533; }
      .r-cal .label { --l: 0;   --t: 3; --w: 487; transform: translateX(108%); }

      /* Speaker: label emerges rightwards from behind the button. */
      .r-spk        { --l: 1969; --t: 1346; --w: 834; --h: 382; }
      .r-spk .src   { --l: 0;   --t: 0; --w: 382; }
      .r-spk .clip  { --l: 331; --t: 0; --w: 503; }
      .r-spk .label { --l: 46;  --t: 6; --w: 457; transform: translateX(-108%); }

      .reveal:hover .label,
      .reveal:focus-within .label { transform: translateX(0); }

      .bars { display: contents; }

      .socials { display: contents; }
      .social { --t: 1738; }
      .s-tw { --l: 1192; --w: 280; }
      .s-ra { --l: 1493; --w: 282; }
      .s-sc { --l: 1798; --w: 267; }
      .s-fb { --l: 2090; --w: 264; }
      .s-ig { --l: 2382; --w: 272; }

      /* Bottom-right: the mockup's bottom-left now belongs to the EPK bar. */
      .tip-jar {
        position: fixed;
        right: 14px;
        bottom: 14px;
        margin: 0;
        padding: 10px 10px 8px;
      }
      .tip-jar-label { font-size: 10px; }
      .tip-jar-qr { width: 74px; height: 74px; }
    }

    @media (min-width: 768px) and (min-aspect-ratio: 4/3) and (max-height: 520px) {
      .tip-jar { display: none; }
    }

    /* Touch screens big enough for the 16:9 layout (tablets in landscape):
       no hover, so the labels sit in their final positions. */
    @media (min-width: 768px) and (min-aspect-ratio: 4/3) and (hover: none) {
      .reveal .label { transform: none; transition: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .logo, .scene { animation: none; }
      .src, .social, .tip-jar, .reveal .label { transition: none; }
    }
  </style>
</head>
<body>
